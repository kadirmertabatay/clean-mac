name: Feature request
description: Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: "E.g.: Every month I notice Xcode taking up space, but I don't know which parts can be deleted."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: If the feature deletes something, how do we prevent accidental data loss?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
