name: Özellik önerisi
description: Yeni bir özellik ya da iyileştirme öner
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Hangi sorunu çözüyor?
      description: "Örn: Her ay Xcode'un yer kapladığını fark ediyorum ama hangi kısmın silinebileceğini bilmiyorum."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Önerdiğin çözüm
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Güvenlik etkisi
      description: Öneri bir şey siliyorsa, yanlışlıkla veri kaybını nasıl önleriz?
  - type: textarea
    id: alternatives
    attributes:
      label: Düşündüğün alternatifler
