# Categories for GitHub's automatically generated release notes, based on pull request labels.
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: New features
      labels: ["enhancement", "feature"]
    - title: Safety
      labels: ["safety"]
    - title: Bug fixes
      labels: ["bug"]
    - title: Translations
      labels: ["translation"]
    - title: Documentation
      labels: ["documentation"]
    - title: Maintenance
      labels: ["dependencies", "ci", "refactor"]
    - title: Other changes
      labels: ["*"]
