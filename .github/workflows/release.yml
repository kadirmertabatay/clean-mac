name: Release

# When a tag like v1.2.3 is pushed, builds the universal app and creates a draft GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Universal bundle and archive
        run: ./build-app.sh --zip
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="build/CleanMac-$VERSION.zip"
          test -f "$ZIP" || { echo "The Info.plist version ($ZIP) does not match the tag"; exit 1; }
          SHA=$(cut -d' ' -f1 "$ZIP.sha256")
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" --draft --title "CleanMac $VERSION" \
            --generate-notes --notes "See the README for installation and first launch. SHA-256: \`$SHA\`"
